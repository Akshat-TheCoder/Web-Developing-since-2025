<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="div">0</div>
    <button id="btn">Click Me</button>
    <script>
        document.getElementById('btn').addEventListener('click',()=>{
            let currnum = parseInt(document.getElementById('div').innerHTML)
            document.getElementById('div').innerHTML = currnum + 1;
        })
    </script>
</body>
</html>
