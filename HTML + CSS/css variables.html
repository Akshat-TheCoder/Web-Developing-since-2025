<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
    <style>
        :root{
            --rcolor: red;
            --bcolor:black;
            --wcolor:white;
        }
        *{
            margin: 0;
            padding: 0;

        }
        body{
            background-color: var(--rcolor)
        }
        nav ul{
            display: flex;
            background-color: var(--bcolor);
        }
        nav ul li{
            color: var(--wcolor);
            font-family: sans-serif;
            font-size: large;
            margin: 2px
        }
        
    </style>
</head>
<body>
    <header>
        <nav class="nav">
            <ul>
                <li>Home</li>
                <li>About us</li>
                <li>Contact us</li>
            </ul>
        </nav>
    </header>
</body>
</html>
