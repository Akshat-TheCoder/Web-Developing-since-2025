<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 90vw;
            margin: 50px auto;
            height: 400px;
            border: 2px solid grey;
            position: relative;
        }

        .box {
            position: absolute;
            bottom: 0px;
            left: 0px;
            height: 60%;
            width: 50px;
            background-color: greenyellow;
        }

        .ball {
            background-color: red;
            width: 50px;
            height: 50px;
            border-radius: 500px;
            position: absolute;
            bottom: 60%;
            left: 0px;
            border-top: 2px solid black;
            box-sizing: border-box;
            animation: rotate 4s linear 1s forwards,
                bounce 5s 4s linear forwards,
                bounce1 3s 9s linear forwards,
                bounce2 3s 12s linear forwards;
            /* animation: animateX 3s linear infinite,
                    animateY 1s ease-out infinite alternate; */
        }

        @keyframes rotate {
            0% {
                transform: translate(5px) rotate(0.5turn);
            }

            20% {
                transform: translate(10px) rotate(360deg);
            }

            30% {
                transform: translate(15px) rotate(0.5turn);
            }

            40% {
                transform: translate(20px) rotate(360deg);
            }

            50% {
                transform: translate(25px) rotate(0.5turn);
            }

            60% {
                transform: translate(30px) rotate(360deg);
            }

            70% {
                transform: translate(35px) rotate(0.5turn);
            }

            80% {
                transform: translate(40px) rotate(360deg);
            }

            90% {
                transform: translate(45px) rotate(0.5turn);
            }

            100% {
                transform: translate(50px) rotate(360deg);
            }
        }

        @keyframes bounce {
            0% {
                left: 0px;
            }

            20% {
                left: 100px;
                bottom: 55%;
            }

            40% {
                left: 120px;
                bottom: 45%;
            }

            60% {
                left: 160px;
                bottom: 35%;
            }

            80% {
                left: 220px;
                bottom: 20%;
            }

            100% {
                left: 300px;
                bottom: 0%;
            }
        }

        @keyframes bounce1 {
            0% {
                left: 300px;
                bottom: 0%;
            }

            30% {
                left: 350px;
                bottom: 5%;
            }

            60% {
                left: 400px;
                bottom: 10%;
            }

            90% {
                left: 500px;
                bottom: 20%;
            }

            100% {
                left: 600px;
                bottom: 30%;
            }
        }

        @keyframes bounce2 {
            0% {
                left: 600px;
                bottom: 30%;
            }

            30% {
                left: 650px;
                bottom: 20%;
            }

            60% {
                left: 700px;
                bottom: 10%;
            }

            90% {
                left: 800px;
                bottom: 5%;
            }

            100% {
                left: 900px;
                bottom: 0%;
            }
        }

        /* @keyframes animateX {
            from{
                left: 0%;
            }
            to{
                left: 100%;
            }
         }
         @keyframes animateY {
            from{
                bottom: 0%;
            }
            to{
                bottom: 100%;
            }
         } */
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
        <div class="ball"></div>
    </div>
</body>

</html>
