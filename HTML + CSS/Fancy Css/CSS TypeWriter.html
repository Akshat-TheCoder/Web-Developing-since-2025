<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS TypeWriter Efeect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: black;
            color: white;
            font-size: 1.5rem;
            text-align: center;
            font-family: sans-serif;
            min-height: 100vh;
            padding-top: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .typewriter {
            display: flex;
            justify-content: center;
        }

        .typewriter p {
            margin-inline: auto;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid orange;
            animation: typing 3s 2s steps(22) infinite,
                blink 1s 2s step-end infinite;
        }

        @keyframes typing {
            from {
                width: 0;
            }

            to {
                width: 22ch;
            }

            /* matches number of characters */
        }

        @keyframes blink {
            50% {
                border-color: transparent;
            }
        }
    </style>
</head>

<body>
    <div class="typewriter">
        <div>
            <p>Css TypeWriter Effect</p>
        </div>
    </div>
</body>

</html>
