<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        :root {
            --loader-size: 150px;
        }

        .loader {
            position: relative;
            display: inline-block;
            width: var(--loader-size);
            height: var(--loader-size);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loader::before,
        .loader::after {
            position: absolute;
            content: '';
            width: var(--loader-size);
            height: var(--loader-size);
            border-radius: 100px;
            background-color: #043253;
            animation: pulse 2s linear infinite;
        }

        .loader::after {
            animation-delay: 1s;
        }

        @keyframes pulse {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            50%{
                opacity: 0.6;
            }
            100% {
                transform: scale(1);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <span class="loader"></span>
</body>

</html>
