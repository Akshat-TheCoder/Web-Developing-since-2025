<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        class password {
            constructor() {
                console.log(`Welcome To the Password Generator`);
                this.password = "";
            }
            generatepassword(len) {
                let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
                let nums = "1234567890";
                let specials = "!@#$%^&*()_+-=?:;,.<>[]{}/|";
                if (len < 5) {
                    console.log(`Your password's length should be greater than 4`);
                    alert(`Your Password's Length should be greater than 4`);
                }
                else {
                    let i = 0;
                    while (i < len) {
                        this.password += chars[Math.floor(Math.random() * chars.length)];
                        this.password += nums[Math.floor(Math.random() * nums.length)];
                        this.password += specials[Math.floor(Math.random() * specials.length)];
                        i += 3;
                    }
                    console.log(`Your Generated Password is: ${this.password.slice(0, len)}`);
                    alert(`Your Generated Password is: ${this.password.slice(0, len)}`);
                }
            }
        }
        let p = new password();
        let a = parseInt(prompt("Enter the length of password you want to generate: "));
        p.generatepassword(a);
    </script>
</body>

</html>
