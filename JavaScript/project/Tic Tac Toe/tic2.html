<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    :root {
      --bg: #050816;
      --card: #0f172a;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.15);
      --x-color: #38bdf8;
      --o-color: #f97316;
      --line-color: rgba(148, 163, 184, 0.7);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --danger: #f43f5e;
      --shadow-soft: 0 20px 40px rgba(15, 23, 42, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.16), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(34, 197, 94, 0.16), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 1.5rem;
    }

    .game-wrapper {
      width: 100%;
      max-width: 480px;
      background: radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.12), transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(34, 197, 94, 0.12), transparent 50%),
        var(--card);
      border-radius: 1.5rem;
      box-shadow: var(--shadow-soft);
      padding: 1.75rem 1.5rem 1.5rem;
      border: 1px solid rgba(148, 163, 184, 0.25);
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
    }

    .game-wrapper::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: radial-gradient(circle at 20% -10%, rgba(96, 165, 250, 0.16), transparent 55%),
        radial-gradient(circle at 80% 110%, rgba(45, 212, 191, 0.18), transparent 55%);
      opacity: 0.7;
      pointer-events: none;
      z-index: -1;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .title-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    h1 span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 0.5rem;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.4);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 0.45rem 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      letter-spacing: 0.02em;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease, color 0.12s ease;
      white-space: nowrap;
    }

    button span.dot {
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 999px;
      background: currentColor;
    }

    .btn-primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #0b1120;
      box-shadow: 0 12px 22px rgba(22, 163, 74, 0.55);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 26px rgba(22, 163, 74, 0.65);
    }

    .btn-ghost {
      background: rgba(15, 23, 42, 0.85);
      color: var(--muted);
      border: 1px solid rgba(148, 163, 184, 0.4);
    }

    .btn-ghost:hover {
      background: rgba(15, 23, 42, 1);
      color: var(--text);
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.7);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .status-label {
      font-size: 0.84rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .status-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .message {
      font-size: 0.9rem;
      color: var(--text);
      min-height: 1.2rem;
    }

    .board-wrapper {
      position: relative;
      padding: 0.75rem;
      border-radius: 1.25rem;
      background: radial-gradient(circle at 30% 0%, rgba(56, 189, 248, 0.15), transparent 65%),
        radial-gradient(circle at 70% 100%, rgba(34, 197, 94, 0.2), transparent 60%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.95), #020617);
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.9);
      margin-bottom: 1.25rem;
    }

    .board {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 360px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      position: relative;
    }

    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.4rem, 7vw, 3.3rem);
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: background-color 0.12s ease, transform 0.12s ease, color 0.12s ease, box-shadow 0.12s ease;
      user-select: none;
    }

    .cell::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 1rem;
      border: 1px solid transparent;
      transition: border-color 0.12s ease, background-color 0.12s ease;
    }

    .cell:hover::before {
      background: rgba(15, 23, 42, 0.7);
      border-color: rgba(148, 163, 184, 0.6);
    }

    .cell:hover {
      transform: translateY(-1px);
    }

    .cell.taken {
      cursor: default;
      transform: none;
    }

    .cell.taken:hover::before {
      background: transparent;
      border-color: transparent;
    }

    .cell.x {
      color: var(--x-color);
      text-shadow: 0 0 22px rgba(56, 189, 248, 0.6);
    }

    .cell.o {
      color: var(--o-color);
      text-shadow: 0 0 22px rgba(249, 115, 22, 0.6);
    }

    .cell.win {
      text-shadow: 0 0 28px rgba(34, 197, 94, 0.85);
    }

    /* Grid lines */
    .board::before,
    .board::after {
      content: "";
      position: absolute;
      background: linear-gradient(to bottom,
          transparent,
          var(--line-color),
          transparent);
      pointer-events: none;
    }

    .board::before {
      width: 2px;
      height: 84%;
      left: 33.33%;
      top: 8%;
      box-shadow: 33.33% 0 0 var(--line-color);
    }

    .board::after {
      height: 2px;
      width: 84%;
      top: 33.33%;
      left: 8%;
      background: linear-gradient(to right,
          transparent,
          var(--line-color),
          transparent);
      box-shadow: 0 33.33% 0 var(--line-color);
    }

    /* Scoreboard */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.6rem;
      margin-bottom: 1rem;
      font-size: 0.82rem;
    }

    .score-card {
      background: rgba(15, 23, 42, 0.88);
      border-radius: 0.9rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid rgba(148, 163, 184, 0.45);
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      justify-content: center;
      min-height: 3rem;
    }

    .score-label {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .score-value {
      font-size: 1rem;
      font-weight: 600;
    }

    .score-x .score-value {
      color: var(--x-color);
    }

    .score-o .score-value {
      color: var(--o-color);
    }

    .score-draw .score-value {
      color: var(--accent);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: var(--muted);
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .chip {
      border-radius: 999px;
      padding: 0.2rem 0.6rem;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.9);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .chip-dot {
      width: 0.3rem;
      height: 0.3rem;
      border-radius: 999px;
      background: var(--accent);
    }

    .danger {
      color: var(--danger);
    }

    @media (max-width: 480px) {
      .game-wrapper {
        padding: 1.25rem 1rem 1.1rem;
        border-radius: 1.25rem;
      }

      h1 {
        font-size: 1.3rem;
      }

      .status-bar {
        flex-direction: column;
        align-items: flex-start;
      }

      .scoreboard {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .board-wrapper {
        padding: 0.55rem;
      }
    }

    @media (max-width: 360px) {
      .scoreboard {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="game-wrapper">
    <div class="header">
      <div class="title-group">
        <h1>
          <span>X</span>
          <span>O</span>
          Tic Tac Toe
        </h1>
        <p class="subtitle">Tap the grid, line up three in a row, and keep score.</p>
      </div>
      <div class="controls">
        <button id="new-round" class="btn-ghost">
          <span class="dot"></span>
          New round
        </button>
        <button id="reset-game" class="btn-primary">
          <span class="dot"></span>
          Reset game
        </button>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-label">
        <span class="status-dot"></span>
        Turn
      </div>
      <div id="status-message" class="message">Player X to move</div>
    </div>

    <div class="board-wrapper">
      <div id="board" class="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
    </div>

    <div class="scoreboard">
      <div class="score-card score-x">
        <div class="score-label">Player X</div>
        <div id="score-x" class="score-value">0</div>
      </div>
      <div class="score-card score-o">
        <div class="score-label">Player O</div>
        <div id="score-o" class="score-value">0</div>
      </div>
      <div class="score-card score-draw">
        <div class="score-label">Draws</div>
        <div id="score-draw" class="score-value">0</div>
      </div>
    </div>

    <div class="footer">
      <div class="chip">
        <span class="chip-dot"></span>
        First to 3 wins a mini-match
      </div>
      <div class="danger">Tip: Resize the window to see responsive layout.</div>
    </div>
  </div>

  <script>
    const boardEl = document.getElementById("board");
    const cells = Array.from(document.querySelectorAll(".cell"));
    const statusMessage = document.getElementById("status-message");
    const newRoundBtn = document.getElementById("new-round");
    const resetGameBtn = document.getElementById("reset-game");
    const scoreXEl = document.getElementById("score-x");
    const scoreOEl = document.getElementById("score-o");
    const scoreDrawEl = document.getElementById("score-draw");

    let boardState = Array(9).fill(null);
    let currentPlayer = "X";
    let isGameOver = false;
    let scores = { X: 0, O: 0, draw: 0 };

    const winPatterns = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    function updateStatusMessage(text) {
      statusMessage.textContent = text;
    }

    function updateScores() {
      scoreXEl.textContent = scores.X;
      scoreOEl.textContent = scores.O;
      scoreDrawEl.textContent = scores.draw;
    }

    function checkWinner() {
      for (const [a, b, c] of winPatterns) {
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
          return { winner: boardState[a], pattern: [a, b, c] };
        }
      }
      if (boardState.every(cell => cell !== null)) {
        return { winner: "draw" };
      }
      return null;
    }

    function handleCellClick(e) {
      const cell = e.target;
      const index = parseInt(cell.getAttribute("data-index"), 10);

      if (boardState[index] || isGameOver) return;

      boardState[index] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.classList.add("taken", currentPlayer.toLowerCase());

      const result = checkWinner();

      if (result && result.winner !== "draw") {
        isGameOver = true;
        scores[result.winner]++;
        updateScores();
        updateStatusMessage("Player " + result.winner + " wins!");
        if (result.pattern) {
          result.pattern.forEach(i => cells[i].classList.add("win"));
        }
        return;
      }

      if (result && result.winner === "draw") {
        isGameOver = true;
        scores.draw++;
        updateScores();
        updateStatusMessage("It’s a draw.");
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      updateStatusMessage("Player " + currentPlayer + " to move");
    }

    function clearBoard() {
      boardState = Array(9).fill(null);
      isGameOver = false;
      cells.forEach(cell => {
        cell.textContent = "";
        cell.className = "cell";
      });
    }

    function startNewRound() {
      clearBoard();
      updateStatusMessage("Player " + currentPlayer + " to move");
    }

    function resetGame() {
      clearBoard();
      currentPlayer = "X";
      scores = { X: 0, O: 0, draw: 0 };
      updateScores();
      updateStatusMessage("Player X to move");
    }

    boardEl.addEventListener("click", handleCellClick);
    newRoundBtn.addEventListener("click", startNewRound);
    resetGameBtn.addEventListener("click", resetGame);

    updateScores();
  </script>
</body>

</html>
