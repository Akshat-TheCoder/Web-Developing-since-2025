<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the number</title>
</head>

<body>
    <script>
        var a = Math.random();
        let b = Math.floor(a * 100) + 1;
        console.log(`${b}`);
        let count = 0;
        function askGuess() {
            let num = Number(prompt("Guess the number between 1 and 100"));
            count++;
            if (num === b) {
                let score = 100 - (count - 1)*5
                alert('Your guess is correct and your score is ' + score + "/100");
            } else if (num < b) {
                alert('Your number is low! Please enter another higher number.');
                askGuess();
            } else if (num > b) {
                alert(`Your number is high! please enter a lower number`);
                askGuess();
            }
        }
        askGuess();
    </script>
</body>

</html>
