<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 100vh;
            background-color: rgb(47, 0, 255);
        }

        #btn {
            font-size: 4rem;
            background-color: rgb(0, 255, 34);
            color: white;
            border-radius: 10px;
            ;
            padding: 20px 40px;
            border: none;
        }
    </style>
</head>

<body>
    <button id="btn">Hi</button>
    <script>
        let cont = document.querySelector(".con")
        let btna = document.getElementById("btn")

        function randomcolora() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            return `rgb(${r},${g},${b})`;  // Direct full string
        }
        function randomcolorb() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            return `rgb(${r},${g},${b})`;  // Direct full string
        }

        function randomcolorc() {
            const r = Math.floor(Math.random() * 255);
            const b = Math.floor(Math.random() * 255);
            return `rgb(${r},205,${b})`;  // Direct full string
        }
        console.log(randomcolorc())
        let bo = document.body;
        setInterval(() => {
            btna.style.color = randomcolora();
        }, 1000);

        setInterval(() => {
            bo.style.backgroundColor = randomcolorb();
        }, 2000);

        setTimeout(() => {
            btna.style.backgroundColor = randomcolorc();
        }, 3000);
    </script>
</body>

</html>
