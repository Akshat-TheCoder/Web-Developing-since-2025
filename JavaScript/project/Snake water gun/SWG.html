<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Water Gun</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        body {
            background-color: black;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #ff00b1;
            border-radius: 10px;
            font-size: 1.5rem;
            border: none;
            font-family: "Poppins", sans-serif;
            font-weight: 600;
            color: white;
            outline: 3px solid #ff00b1;
            outline-offset: 2.5px;
        }

        h1,
        h2 {
            color: white;
            text-align: center;
            font-size: 16px;
            font-family: "Poppins", sans-serif;
            font-weight: 500;
        }

        .h1 {
            font-size: 40px;
            margin-top: 30px;
            font-weight: 800;
        }

        .h2 {
            font-size: 30px;
            margin-top: 10px;
            font-weight: 700;
        }

        .h3 {
            font-size: 25px;
            margin-top: 20px;
            font-weight: 600;
        }

        .result {
            color: white;
            margin-top: 30px;
            font-size: 20px;
            font-family: "Poppins", sans-serif;
            font-weight: 500;
            border: 4px solid #ff00b1;
            margin: 100px;
            border-radius: 20px;
            text-align: left;
            padding: 25px 50px;
        }

        #h1 {
            text-align: center;
            font-size: 24px;
            margin-top: 20px;
            font-family: "Poppins", sans-serif;
        }

        .result h1 {
            font-size: 36px;
            margin: 0;
            font-weight: 700;
            text-align: center;
            color: #ff8adb;
        }

        .hg {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .player,
        .computer {
            text-align: center;
        }

        .hg h1 {
            font-size: 40px;
            margin: 0;
            font-weight: 600;
            color: yellow;
        }

        .hg p {
            font-size: 30px;
            margin: 10px 0 0 0;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <h1 class="h1">Hi! I am The Ai Sweety!!</h1>
    <h1 class="h2">Let's We Play The Ancient Game Snake, Water And Gun.</h1>
    <h2 class="h3">Choose an Option</h2>

    <div class="opt">
        <div class="btn">
            <button id="btn1">Snake</button>
            <button id="btn2">Water</button>
            <button id="btn3">Gun</button>
        </div>
        <h1 id="h1" hidden></h1>
    </div>

    <div class="result" hidden>
        <h1>Score Board</h1>
        <div class="hg">
            <div class="player">
                <h1>Your score</h1>
                <p>0</p>
            </div>
            <div class="computer">
                <h1>Sweetie's Score 🙎🏼‍♀️</h1>
                <p>0</p>
            </div>
        </div>
    </div>

    <script>
        let btn1 = document.getElementById("btn1");
        let btn2 = document.getElementById("btn2");
        let btn3 = document.getElementById("btn3");
        let result = document.querySelector(".result");
        let h1 = document.getElementById("h1");
        let playerScore = document.querySelector(".player p");
        let computerScore = document.querySelector(".computer p");

        function SWG() {
            // 0 = Snake, 1 = Water, 2 = Gun
            return Math.floor(Math.random() * 3);
        }

        let count = 0;
        let compcount = 0;

        function draw() {
            h1.innerText = "Draw! Both chose the same option.";
            h1.style.color = "yellow";
            h1.hidden = false;
            result.hidden = false;
        }

        function win() {
            h1.innerText = "You Win!";
            h1.style.color = "lightgreen";
            h1.hidden = false;
            count+= 2;
            compcount--;
            updateScore();
        }

        function lose() {
            h1.innerText = "You Lose! Better luck next time.";
            h1.style.color = "red";
            h1.hidden = false;
            compcount+= 2;
            count--;
            updateScore();
        }

        function updateScore() {
            playerScore.innerText = count;
            computerScore.innerText = compcount;
            result.hidden = false;

            // Player color
            if (count < 0) {
                playerScore.style.color = "red";
            } else if (count > 0) {
                playerScore.style.color = "lightgreen";
            } else {
                playerScore.style.color = "white";
            }

            // Computer color
            if (compcount < 0) {
                computerScore.style.color = "red";        // Computer losing
            } else if (compcount > 0) {
                computerScore.style.color = "lightgreen"; // Computer winning
            } else {
                computerScore.style.color = "white";
            }
        }

        btn1.addEventListener("click", () => {
            let comp = SWG();
            if (comp == 0) {
                draw();
            } else if (comp == 1) {
                win();
            } else {
                lose();
            }
        });

        btn2.addEventListener("click", () => {
            let comp = SWG();   // fixed: = not ==
            if (comp == 0) {
                lose();
            } else if (comp == 1) {
                draw();
            } else {
                win();
            }
        });

        btn3.addEventListener("click", () => {
            let comp = SWG();
            if (comp == 0) {
                win();
            } else if (comp == 1) {
                lose();
            } else {
                draw();
            }
        });
    </script>
</body>

</html>
