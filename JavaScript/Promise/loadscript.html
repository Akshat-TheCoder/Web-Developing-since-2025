<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        .con {
            background-color: rgb(1, 10, 78);
            color: white;
            text-align: center;
            font-size: 3rem;
            font-family: sans-serif;
            font-weight: 600;
            font-style: oblique;
            /* padding: 100px; */
            min-height: 100vh;
            display: flex;
            align-content: center;
            justify-content: center;
            flex-wrap: wrap;
            text-decoration: line-through;
            text-decoration-color: #00000096;
            text-decoration-thickness: 10px;
            text-decoration-style: dashed;
        }
    </style>
</head>

<body>
    <script>
        let a = document.createElement('script')
        a.innerHTML = `alert('Welcome Me! As I am a newly Loaded Script')`

        const b = document.createElement('h1')
        b.innerText = `I am A Hacker`

        let prom1 = new Promise((resolve, reject) => {
            let M = Math.random();
            console.log(M);
            if (M < 0.1) {
                setTimeout(() => {
                    document.body.prepend(b)
                    document.body.classList.add("con")
                }, 1000);
            }
            else if (M < 0.5) {
                document.head.append(a)
                resolve('Script is loaded')
            }
            else {
                reject('Script is not loaded')
            }
        })

        prom1.then((a) => {
            console.log(a);
            alert('Hello World');
        })
            .catch((b) => {
                alert(b)
                console.log(b)
            })
    </script>
</body>

</html>
