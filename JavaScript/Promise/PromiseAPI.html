<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        .con {
            background-color: rgb(1, 10, 78);
            color: white;
            text-align: center;
            font-size: 3rem;
            font-family: unset;
            font-weight: 600;
            font-style: oblique;
            /* padding: 100px; */
            min-height: 100vh;
            display: flex;
            align-content: center;
            justify-content: center;
            flex-wrap: wrap;
            text-decoration: line-through;
            text-decoration-color: #000000a5;
            text-decoration-thickness: 10px;
            text-decoration-style: dashed;
            text-transform: capitalize;
        }
    </style>
</head>

<body>
    <script>
        let a = document.createElement('script')
        // a.innerHTML = `alert('Welcome Me! As I am a newly Loaded Script')`

        const b = document.createElement('h1')
        b.innerText = `I am A Hacker`

        let prom1 = new Promise((resolve, reject) => {
            let M = Math.random();
            console.log(M);
            if (M < 0.1) {
                setTimeout(() => {
                    document.body.prepend(b);
                    document.body.classList.add("con");
                    resolve('DOM updated for prom1');
                }, 1000);
            }
            else if (M < 0.5) {
                document.head.append(a)
                resolve('Script 1 is loaded')
            }
            else {
                reject('Script 1 is not loaded')
            }
        })
        let prom2 = new Promise((resolve, reject) => {
            let Ma = Math.random();
            console.log(Ma);
            if (Ma < 0.1) {
                setTimeout(() => {
                    document.body.prepend(b);
                    document.body.classList.add("con");
                    resolve('DOM updated for prom2');
                }, 1000);
            }
            else if (Ma < 0.5) {
                document.head.append(a)
                resolve('Script 2 is loaded ')
            }
            else {
                reject('Script 2 is not loaded')
            }
        })

        // prom1.then((a) => {
        //     console.log(a);
        //     // alert('Hello World');
        // })
        //     .catch((b) => {
        //         // alert(b)
        //         console.log(b)
        //     })


        // Promise APIs

        // Promise.all
        let prom3 = Promise.all([prom1, prom2])
        prom3.then((a) => {
            console.log(a);
        }).catch((b) => {
            console.log(b);
        })

        // promise.allsetteled
        let prom4 = Promise.allSettled([prom1, prom2])
        prom4.then((a) => {
            console.log(a);
        }).catch((b) => {
            console.log(b);
        })

        // promise.race
        let prom5 = Promise.race([prom1, prom2])
        prom5.then((a) => {
            console.log(a);
        }).catch((b) => {
            console.log(b);
        })

        // promise.any
        let prom6 = Promise.any([prom1, prom2])
        prom6.then((a) => {
            console.log(a + " N");
        }).catch((b) => {
            console.log(b + " N");
        })

        // promise.resolve and promise.reject
        // Randomized promises
        let rand1 = Math.random();
        let rand2 = Math.random();

        console.log("rand1:", rand1);
        console.log("rand2:", rand2);

        // Use Promise.resolve / Promise.reject based on random values
        let prom7 = (rand1 < 0.5)
            ? Promise.resolve("Success from prom7")
            : Promise.reject("Failure from prom7");

        let prom8 = (rand2 < 0.5)
            ? Promise.resolve("Success from prom8")
            : Promise.reject("Failure from prom8");

        // Handle them individually
        prom7.then(msg => console.log("prom7 resolved:", msg))
            .catch(err => console.log("prom7 rejected:", err));

        prom8.then(msg => console.log("prom8 resolved:", msg))
            .catch(err => console.log("prom8 rejected:", err));

        // Try with Promise APIs

        // Promise.all → succeeds only if both succeed
        Promise.all([prom7, prom8])
            .then(results => console.log("Promise.all results:", results))
            .catch(err => console.log("Promise.all failed:", err));

        // Promise.allSettled → always resolves with array of outcomes
        Promise.allSettled([prom7, prom8])
            .then(results => console.log("Promise.allSettled results:", results));

        // Promise.race → first one to settle (success or failure)
        Promise.race([prom7, prom8])
            .then(result => console.log("Promise.race result:", result))
            .catch(err => console.log("Promise.race failed:", err));

        // Promise.any → first success, rejects only if all fail
        Promise.any([prom7, prom8])
            .then(result => console.log("Promise.any result:", result))
            .catch(err => console.log("Promise.any failed:", err));
    </script>
</body>

</html>
