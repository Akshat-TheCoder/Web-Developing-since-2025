<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise</title>
</head>

<body>
    <script>
        console.log('Hello!');

        let promise1 = new Promise((resolve, reject) => {
            let a = Math.random();
            if (a < 0.1) {
                resolve('You are very lucky')
                console.log(a);

            }
            else if (a < 0.5) {
                console.log(a);
                reject('Nothing!');
            }
            else {
                setTimeout(() => {
                    resolve('I am done');
                }, 3000);
            }
        })

        promise1.then((a) => {
            console.log(a);
        })

        promise1.catch((b)=>{
            console.log(b);
        })
    </script>
</body>

</html>
