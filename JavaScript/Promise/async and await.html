<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        async function random() {
            return new Promise((resolve, reject) => {
                let a = Math.random();
                setTimeout(() => {
                    resolve(a);
                }, 3000);
            }
            )
        };

        async function GH() {
            let Rand = await random();
            alert(Rand);
            console.log(Rand);
        }
        GH();
    </script>
</body>

</html>
