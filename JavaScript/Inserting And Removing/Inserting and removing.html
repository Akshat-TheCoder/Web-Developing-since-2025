<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insrting and Removing</title>
    <style>
        .gb {
            background-color: yellowgreen;
        }

        .red {
            color: red;
        }

        .white {
            color: white;
        }
    </style>
</head>

<body>
    <div class="container bg ha">
        <div class="box">Akshat</div>
        <div class="box">Akshat</div>
        <div class="box white">I was white!!</div>
    </div>
    <script>
        let a = document.querySelector(".container");
        let div = document.createElement("div");
        div.innerHTML = "I have been inserted after<b> by using appendChild or after</b>";
        // a.appendChild(div); or
        a.after(div);

        let span = document.createElement("div");
        span.innerHTML = "I have been inserted before<b>by  using prepend or before</b>";
        // a.before(span); or
        a.prepend(span);

        let b = a.children[2];
        let c = document.createElement("div");
        c.innerHTML = "<b>Akshat!</b>";
        b.replaceWith(c);

        a.insertAdjacentHTML("beforebegin", "<div>beforebegin</div>");
        a.insertAdjacentHTML("afterbegin", "<div>afterbegin</div>");
        a.insertAdjacentHTML("beforeend", "<div>beforeend</div>");
        a.insertAdjacentHTML("afterend", "<div>afterend</div>");

        console.log(a.classList);
        let d = a.className;
        console.log(d);
        let e = [];
        e.push(d);
        console.log(e);

        a.classList.toggle("gb");
        console.log(a.classList.contains("gb"));

        a.classList.add("red");
        a.classList.remove("bg");
        console.log(a.classList);

        let f = a.children[4];
        f.classList.toggle("white");
        console.log(f.classList);
    </script>
</body>

</html>
