<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New DOM Concepts</title>
    <style>
        * {
            margin: 10px;
            padding: 10px;
            font-size: 2rem;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box" style="color: red;">Hey I am Akshat!</div>
        <div class="box">Hey I am Akshat!</div>
        <div class="box" hidden>This Line was hidden</div>
    </div>

    <script>
        let a = document.querySelector(".container");
        let b = document.querySelector(".box");
        let c = a.childNodes[5];
        let d = a.childNodes[3];

        console.log(a.innerHTML);
        console.log(a.innerText);
        console.log(b.innerHTML);
        console.log(b.innerText);

        b.innerText = "ak"

        console.log(a.nodeName);

        c.hidden = false;
        console.log(a.childNodes[5].hidden);
        d.remove();
    </script>
</body>

</html>
