<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            min-height: 100vh;
        }

        .form {
            min-height: 100vh;
            background-color: rgb(0, 37, 53);
            text-align: center;
            color: wheat;
            font-size: 20px;
            font-family: sans-serif;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        form {
            border: 2px solid white;
            padding: 50px 100px;
            border-radius: 10px;
            margin: 0 3rem;
            max-width: 600px;
        }

        .input {
            margin-top: 20px;
            display: flex;
        }

        #btn {
            font-size: 24px;
            background: red;
            border: none;
            color: white;
            padding: 10px 10px;
            border-radius: 5px;
            font-weight: 600;
            margin-left: 1rem;
            width: 100px;
            cursor: pointer;
        }

        #inp {
            width: calc(100% - 125px);
            border-radius: 5px;
            background: rgb(0 70 100);
            border: 2px solid white;
            padding-left: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        #inp::placeholder {
            font-size: 16px;
            color: white;
            font-weight: 500;
        }

        #book {
            border: 2px solid white;
            padding: 20px 50px;
            border-radius: 10px;
            margin: 3rem;
            width: -webkit-fill-available;
            max-height: 400px;
            overflow-y: auto;
            box-sizing: border-box;
            max-width: 772px;
        }

        #ul {
            text-align: left;
            max-width: 100%;
            padding: 0;
        }

        #ul li {
            list-style-type: decimal;
            margin-bottom: 20px;
            word-break: break-all;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #ul li a {
            color: rgb(0, 0, 255);
            cursor: pointer;
            overflow-wrap: break-word;
            display: block;
            word-break: break-all;
            flex: 1;
        }

        .delete-btn {
            margin-left: 10px;
            background: crimson;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="form">
        <form action="javascript:void(0)">
            <h1>Enter any bookmark to save it</h1>
            <div class="input">
                <input type="text" id="inp" placeholder="Enter the Href of the link" aria-label="Bookmark URL">
                <button id="btn" type="button" aria-label="Add Bookmark">Add</button>
            </div>
        </form>
        <div id="book" hidden>
            <ul id="ul"></ul>
        </div>
    </div>

    <script>
        let button = document.getElementById("btn");
        let input = document.getElementById("inp");
        let bm = document.getElementById("book");
        let lister = document.getElementById("ul");

        // Load saved bookmarks on page load
        window.addEventListener("load", () => {
            const saved = JSON.parse(localStorage.getItem("bookmarks") || "[]");
            if (saved.length) bm.hidden = false;
            saved.forEach(v => addBookmarkToList(v));
        });

        button.addEventListener("click", () => {
            let v = input.value.trim();
            if (!v) {
                alert("Enter a valid URL");
                return;
            }
            v = v.startsWith("http") ? v : "https://" + v;
            bm.hidden = false;
            addBookmarkToList(v);

            // Save to localStorage
            const bookmarks = JSON.parse(localStorage.getItem("bookmarks") || "[]");
            bookmarks.push(v);
            localStorage.setItem("bookmarks", JSON.stringify(bookmarks));

            input.value = "";
        });

        function addBookmarkToList(url) {
            const li = document.createElement("li");
            li.innerHTML = `<a href="${url}" target="_blank">${url}</a>`;
            const delBtn = document.createElement("button");
            delBtn.textContent = "Delete";
            delBtn.className = "delete-btn";
            delBtn.onclick = () => {
                li.remove();
                removeBookmark(url);
            };
            li.appendChild(delBtn);
            lister.appendChild(li);
        }

        function removeBookmark(url) {
            let bookmarks = JSON.parse(localStorage.getItem("bookmarks") || "[]");
            bookmarks = bookmarks.filter(b => b !== url);
            localStorage.setItem("bookmarks", JSON.stringify(bookmarks));
            if (!bookmarks.length) bm.hidden = true;
        }
    </script>
</body>

</html>
