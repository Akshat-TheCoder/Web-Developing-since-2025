<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing Post request</title>
</head>

<body>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Delectus reprehenderit impedit provident dolores non
        similique id? Eius doloremque eos iste accusamus impedit facere quaerat ipsum? Rerum quibusdam laborum nulla
        dolorem.</p>
    <script>
        async function testpost() {
            let a = await fetch('/', { method: "POST" })
            let b = await a.text()
            console.log(b)
        }
        testpost();

        async function testput() {
            let a = await fetch('/', { method: "PUT" })
            let b = await a.text()
            console.log(b)
        }
        testput();

        async function testdelete() {
            let a = await fetch('/', { method: "DELETE" })
            let b = await a.text()
            console.log(b)
        }
        testdelete();
    </script>
</body>

</html>
